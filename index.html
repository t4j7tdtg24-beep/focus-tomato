<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Tomato 專注番茄鐘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
<style>
  :root {
    --accent: #d9534f;
    --accent-soft: #fbe9e8;
    --bg: #f7eeed;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #777;
    --border: #e6dcdb;
    --radius: 16px;
  }
  body[data-mode="short"] { --accent: #3a9a6b; --accent-soft: #e5f4ec; --bg: #ecf5f0; --border: #d7e6de; }
  body[data-mode="long"]  { --accent: #3b74c4; --accent-soft: #e6eefa; --bg: #ecf1f8; --border: #d6e0ee; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .4s;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  header h1 { font-size: 1.35rem; margin: 0; }
  header h1 span { color: var(--accent); transition: color .4s; }

  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .icon-btn { background: var(--card); padding: 8px 12px; color: var(--text); border: 1px solid var(--border); }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }

  /* Timer */
  .tabs { display: flex; gap: 6px; background: var(--accent-soft); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; padding: 8px 4px; background: transparent; color: var(--muted); font-size: .95rem; }
  .tabs button.active { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .ring-box { position: relative; width: 240px; max-width: 70vw; aspect-ratio: 1; margin: 24px auto 12px; }
  .ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { stroke: var(--accent-soft); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .4s; }
  .time {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .time .digits { font-size: clamp(2.6rem, 13vw, 3.6rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .time .label { color: var(--muted); font-size: .9rem; margin-top: 2px; }

  .meta { text-align: center; color: var(--muted); font-size: .92rem; min-height: 1.4em; }
  .meta b { color: var(--text); }

  .controls { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .controls button { padding: 12px 16px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .controls #startBtn { background: var(--accent); color: #fff; min-width: 120px; font-size: 1.05rem; }
  .controls button:active { transform: scale(.97); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats div { padding: 4px 0; }
  .stats .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); transition: color .4s; }
  .stats .cap { font-size: .8rem; color: var(--muted); }

  /* Todo */
  .card h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .add-row { display: flex; gap: 8px; }
  .add-row input, .add-row select {
    font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text);
  }
  .add-row input { flex: 1; min-width: 0; }
  .add-row button { padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; }

  ul.tasks { list-style: none; padding: 0; margin: 14px 0 0; }
  .task {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    border: 2px solid transparent; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .task:hover { background: var(--accent-soft); }
  .task.current { border-color: var(--accent); background: var(--accent-soft); }
  .task input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  .task .name { flex: 1; word-break: break-word; }
  .task.done .name { text-decoration: line-through; color: var(--muted); }
  .task .count { font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .task .count.over { color: #c0392b; font-weight: 600; }
  .task .del { background: none; color: #bbb; font-size: 1.1rem; padding: 2px 6px; }
  .task .del:hover { color: #d9534f; }
  .empty { text-align: center; color: var(--muted); padding: 18px 0 6px; font-size: .92rem; }
  .list-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .link-btn { background: none; color: var(--muted); text-decoration: underline; padding: 4px; }

  /* Settings dialog */
  dialog { border: none; border-radius: var(--radius); padding: 24px; width: min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 16px; }
  .field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .field input[type=number] { width: 80px; font: inherit; padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dialog-actions button { padding: 8px 16px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-plain { background: #eee; color: #333; }

  @media (max-width: 400px) {
    .controls { gap: 8px; }
    .controls button { padding: 12px 12px; font-size: .95rem; }
    .controls #startBtn { min-width: 100px; }
  }

  .hint { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 8px; }
  kbd { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: .78rem; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(100px);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .92rem;
    transition: transform .3s; z-index: 10; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-mode="focus">
<div class="wrap">
  <header>
    <h1><span>🍅</span> Focus Tomato</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙ 設定</button>
  </header>

  <section class="card">
    <div class="tabs" role="tablist">
      <button data-mode="focus" class="active">專注</button>
      <button data-mode="short">短休息</button>
      <button data-mode="long">長休息</button>
    </div>

    <div class="ring-box">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="8"/>
        <circle class="ring-fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="8"/>
      </svg>
      <div class="time">
        <div class="digits" id="digits">25:00</div>
        <div class="label" id="modeLabel">專注時間</div>
      </div>
    </div>

    <div class="meta" id="meta"></div>

    <div class="controls">
      <button id="resetBtn" title="重設 (R)">↺ 重設</button>
      <button id="startBtn">開始</button>
      <button id="skipBtn" title="跳到下一階段">跳過 ⏭</button>
    </div>
    <div class="hint"><kbd>空白鍵</kbd> 開始/暫停　<kbd>R</kbd> 重設</div>
  </section>

  <section class="card">
    <div class="stats">
      <div><div class="num" id="statRounds">0</div><div class="cap">今日番茄</div></div>
      <div><div class="num" id="statMinutes">0</div><div class="cap">專注分鐘</div></div>
      <div><div class="num" id="statDone">0</div><div class="cap">完成任務</div></div>
    </div>
  </section>

  <section class="card">
    <h2>待辦清單</h2>
    <form class="add-row" id="addForm">
      <input id="taskInput" placeholder="要專注做什麼？" maxlength="60" autocomplete="off">
      <select id="estInput" aria-label="預估番茄數" title="預估番茄數"></select>
      <button type="submit">新增</button>
    </form>
    <ul class="tasks" id="taskList"></ul>
    <div class="list-foot" id="listFoot">
      <span id="leftCount"></span>
      <button class="link-btn" id="clearDoneBtn">清除已完成</button>
    </div>
  </section>
</div>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h3>⚙ 設定</h3>
    <div class="field"><label for="setFocus">專注（分鐘）</label><input type="number" id="setFocus" min="1" max="90" required></div>
    <div class="field"><label for="setShort">短休息（分鐘）</label><input type="number" id="setShort" min="1" max="90" required></div>
    <div class="field"><label for="setLong">長休息（分鐘）</label><input type="number" id="setLong" min="1" max="90" required></div>
    <div class="field"><label for="setSound">結束提示音</label><input type="checkbox" id="setSound"></div>
    <div class="dialog-actions">
      <button type="button" class="btn-plain" id="cancelSettings">取消</button>
      <button type="submit" class="btn-primary">儲存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MODES = {
    focus: { label: '專注時間', tab: '專注中' },
    short: { label: '短休息', tab: '短休息' },
    long:  { label: '長休息', tab: '長休息' },
  };
  const RING_LEN = 2 * Math.PI * 54;

  // ---------- storage ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
  };
  const today = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD

  let settings = Object.assign({ focus: 25, short: 5, long: 15, sound: true }, store.get('ft-settings', {}));
  let tasks = store.get('ft-tasks', []);
  let currentId = store.get('ft-current', null);
  let stats = store.get('ft-stats', null);
  if (!stats || stats.date !== today()) stats = { date: today(), rounds: 0, minutes: 0, done: 0 };

  const saveTasks = () => { store.set('ft-tasks', tasks); store.set('ft-current', currentId); };
  const saveStats = () => store.set('ft-stats', stats);

  // ---------- timer state ----------
  let mode = 'focus';
  let cycle = store.get('ft-cycle', 1); // which focus round we're on (1-4)
  let remaining = settings.focus * 60 * 1000;
  let endAt = null;           // timestamp when running
  let tickHandle = null;

  const durationOf = m => settings[m] * 60 * 1000;

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function renderTimer() {
    const left = endAt ? endAt - Date.now() : remaining;
    $('digits').textContent = fmt(left);
    const frac = Math.min(1, Math.max(0, left / durationOf(mode)));
    $('ring').style.strokeDashoffset = RING_LEN * (1 - frac);
    document.title = endAt ? `${fmt(left)} ${MODES[mode].tab}` : 'Focus Tomato 專注番茄鐘';
  }

  function renderMode() {
    document.body.dataset.mode = mode;
    $('modeLabel').textContent = MODES[mode].label;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    renderMeta();
    renderTimer();
  }

  function renderMeta() {
    const t = tasks.find(t => t.id === currentId && !t.done);
    const round = `第 <b>${cycle}</b> / 4 輪`;
    $('meta').innerHTML = round + ' · ' + (t ? `目前任務：<b>${escapeHtml(t.name)}</b>` : '點下方任務設為目前專注');
  }

  function start() {
    if (endAt) return;
    endAt = Date.now() + remaining;
    $('startBtn').textContent = '暫停';
    tickHandle = setInterval(tick, 250);
    stopTitleFlash();
    renderTimer();
  }
  function pause() {
    if (!endAt) return;
    remaining = Math.max(0, endAt - Date.now());
    endAt = null;
    clearInterval(tickHandle);
    $('startBtn').textContent = '繼續';
    renderTimer();
  }
  function reset() {
    endAt = null;
    clearInterval(tickHandle);
    remaining = durationOf(mode);
    $('startBtn').textContent = '開始';
    renderTimer();
  }
  function setMode(m) {
    mode = m;
    reset();
    renderMode();
  }
  function tick() {
    if (endAt && endAt - Date.now() <= 0) finish(true);
    else renderTimer();
  }

  // natural=true when time ran out; false when skipped
  function finish(natural) {
    endAt = null;
    clearInterval(tickHandle);
    let next;
    if (mode === 'focus') {
      if (natural) recordFocus();
      next = cycle % 4 === 0 ? 'long' : 'short';
    } else {
      if (mode === 'long') cycle = 1; else cycle++;
      store.set('ft-cycle', cycle);
      next = 'focus';
    }
    if (natural) {
      beep();
      startTitleFlash(mode === 'focus' ? '🍅 休息一下！' : '⏰ 該專注了！');
      toast(mode === 'focus' ? '完成一顆番茄！休息一下吧 ☕' : '休息結束，回來專注吧 💪');
    }
    setMode(next);
  }

  function recordFocus() {
    stats.rounds++;
    stats.minutes += settings.focus;
    saveStats();
    const t = tasks.find(t => t.id === currentId && !t.done);
    if (t) { t.pomos++; saveTasks(); renderTasks(); }
    renderStats();
  }

  // ---------- sound & title flash ----------
  let audioCtx = null;
  function beep() {
    if (!settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach(offset => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        const t0 = audioCtx.currentTime + offset;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
        o.connect(g).connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + 0.32);
      });
    } catch {}
  }
  let flashHandle = null;
  function startTitleFlash(msg) {
    stopTitleFlash();
    let on = true;
    flashHandle = setInterval(() => {
      document.title = on ? msg : 'Focus Tomato 專注番茄鐘';
      on = !on;
    }, 1000);
    // stop flashing once user looks at the page
    const stopOnFocus = () => { if (!document.hidden) { stopTitleFlash(); document.removeEventListener('visibilitychange', stopOnFocus); } };
    document.addEventListener('visibilitychange', stopOnFocus);
    setTimeout(stopTitleFlash, 30000);
  }
  function stopTitleFlash() {
    if (flashHandle) { clearInterval(flashHandle); flashHandle = null; renderTimer(); }
  }

  // ---------- tasks ----------
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderTasks() {
    const list = $('taskList');
    list.innerHTML = '';
    const sorted = [...tasks].sort((a, b) => a.done - b.done);
    if (!sorted.length) {
      list.innerHTML = '<li class="empty">還沒有任務，先新增一件要專注的事吧！</li>';
    }
    for (const t of sorted) {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '') + (t.id === currentId && !t.done ? ' current' : '');
      li.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="完成">
        <span class="name">${escapeHtml(t.name)}</span>
        <span class="count${t.pomos > t.est ? ' over' : ''}" title="${t.pomos > t.est ? '超出預估' : ''}">🍅 ${t.pomos} / ${t.est}</span>
        <button class="del" aria-label="刪除" title="刪除">✕</button>`;
      li.querySelector('input').addEventListener('click', e => { e.stopPropagation(); toggleDone(t.id); });
      li.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); removeTask(t.id); });
      li.addEventListener('click', () => { if (!t.done) { currentId = t.id; saveTasks(); renderTasks(); } });
      list.appendChild(li);
    }
    const left = tasks.filter(t => !t.done).length;
    $('leftCount').textContent = tasks.length ? `剩 ${left} 件未完成` : '';
    $('clearDoneBtn').style.visibility = tasks.some(t => t.done) ? 'visible' : 'hidden';
    renderMeta();
  }

  function addTask(name, est) {
    const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, est, pomos: 0, done: false };
    tasks.push(t);
    if (!tasks.some(x => x.id === currentId && !x.done)) currentId = t.id;
    saveTasks(); renderTasks();
  }
  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    t.done = !t.done;
    stats.done += t.done ? 1 : -1;
    stats.done = Math.max(0, stats.done);
    if (t.done && currentId === id) {
      const nextT = tasks.find(x => !x.done);
      currentId = nextT ? nextT.id : null;
    }
    saveTasks(); saveStats(); renderTasks(); renderStats();
  }
  function removeTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    if (currentId === id) currentId = (tasks.find(x => !x.done) || {}).id || null;
    saveTasks(); renderTasks();
  }

  function renderStats() {
    $('statRounds').textContent = stats.rounds;
    $('statMinutes').textContent = stats.minutes;
    $('statDone').textContent = stats.done;
  }

  // ---------- toast ----------
  let toastHandle;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastHandle);
    toastHandle = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ---------- events ----------
  $('startBtn').addEventListener('click', () => {
    // unlock audio on first user gesture (needed on mobile / Safari)
    if (!audioCtx && settings.sound) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    endAt ? pause() : start();
  });
  $('resetBtn').addEventListener('click', reset);
  $('skipBtn').addEventListener('click', () => finish(false));
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    if (endAt && !confirm('計時進行中，確定要切換模式嗎？')) return;
    setMode(b.dataset.mode);
  }));

  for (let i = 1; i <= 8; i++) $('estInput').add(new Option(`🍅 ${i}`, i));
  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('taskInput').value.trim();
    if (!name) { $('taskInput').focus(); return; }
    addTask(name, +$('estInput').value);
    $('taskInput').value = '';
    $('estInput').value = 1;
  });
  $('clearDoneBtn').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    saveTasks(); renderTasks();
  });

  document.addEventListener('keydown', e => {
    if (e.target.closest('input, select, textarea, dialog')) return;
    if (e.code === 'Space') { e.preventDefault(); $('startBtn').click(); }
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  // settings
  const dlg = $('settingsDlg');
  $('settingsBtn').addEventListener('click', () => {
    $('setFocus').value = settings.focus;
    $('setShort').value = settings.short;
    $('setLong').value = settings.long;
    $('setSound').checked = settings.sound;
    dlg.showModal();
  });
  $('cancelSettings').addEventListener('click', () => dlg.close());
  $('settingsForm').addEventListener('submit', () => {
    const clamp = v => Math.min(90, Math.max(1, Math.round(+v) || 1));
    settings = {
      focus: clamp($('setFocus').value),
      short: clamp($('setShort').value),
      long: clamp($('setLong').value),
      sound: $('setSound').checked,
    };
    store.set('ft-settings', settings);
    if (!endAt) reset(); // apply immediately unless a timer is running
    toast(endAt ? '設定已儲存，下一階段開始套用' : '設定已儲存');
  });

  // ---------- init ----------
  $('ring').style.strokeDasharray = RING_LEN;
  remaining = durationOf(mode);
  renderMode();
  renderTasks();
  renderStats();
})();
</script>
</body>
</html>
